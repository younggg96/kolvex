services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: kolvex-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kolvex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kolvex123}
      POSTGRES_DB: ${POSTGRES_DB:-kolvex}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kolvex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kolvex-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: kolvex-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kolvex-network
    restart: unless-stopped

  # 注意: Ollama 使用本地安装的版本（有 GPU 加速），不使用 Docker
  # 如需 Docker 版 Ollama，取消下面的注释
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: kolvex-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - kolvex-network
  #   restart: unless-stopped

  # FastAPI 后端
  backend:
    build: .
    container_name: kolvex-backend
    command: >
      bash -c "pip install -e /TradingAgents --no-deps -q 2>/dev/null;
      uvicorn main:app --host 0.0.0.0 --port 8080 --reload"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kolvex}:${POSTGRES_PASSWORD:-kolvex123}@db:5432/${POSTGRES_DB:-kolvex}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this-in-production}
      DEBUG: ${DEBUG:-True}
      # Supabase 配置（从 .env 文件读取）
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      # CORS 配置
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # Ollama AI 配置 - 使用本地 Ollama (通过 host.docker.internal 访问)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      # ===== LangGraph AI Agent 配置 =====
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      # LLM API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      # Web Search
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Finnhub 股票数据 API
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      # Benzinga 新闻 API
      BENZINGA_API_KEY: ${BENZINGA_API_KEY:-}
      # Email Service
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      # Twilio (用于 WhatsApp 通知)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      # Redis 缓存配置
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - ../TradingAgents:/TradingAgents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kolvex-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  kolvex-network:
    driver: bridge
