services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: kolvex-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kolvex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kolvex123}
      POSTGRES_DB: ${POSTGRES_DB:-kolvex}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kolvex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kolvex-network

  # Ollama AI 服务 (本地 LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: kolvex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - kolvex-network
    restart: unless-stopped
    # 如果有 GPU，取消下面的注释
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # FastAPI 后端
  backend:
    build: .
    container_name: kolvex-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kolvex}:${POSTGRES_PASSWORD:-kolvex123}@db:5432/${POSTGRES_DB:-kolvex}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this-in-production}
      DEBUG: ${DEBUG:-True}
      # Supabase 配置（从 .env 文件读取）
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      # CORS 配置
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # Ollama AI 配置 - 连接到 ollama 容器
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: gemma2:2b
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - kolvex-network
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:

networks:
  kolvex-network:
    driver: bridge
