name: Code Style

# Formatting + style lint for all three apps. Logic lives in scripts/style.sh so CI and local runs match.
#
# STYLE_SCOPE controls how much of each project is checked:
#   changed  only files touched by the PR / push (current default — the codebase predates the formatter)
#   all      the whole project (switch a project to this after its one-time reformat commit)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      base: ${{ steps.base.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ref="origin/${{ github.base_ref }}"
          else
            ref="${{ github.event.before }}"
            if [[ -z "$ref" || "$ref" =~ ^0+$ ]] || ! git cat-file -e "$ref^{commit}" 2>/dev/null; then
              ref="HEAD~1"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Diff base: $ref"

      - name: Filter paths
        id: filter
        run: |
          changed="$(git diff --name-only "$(git merge-base "${{ steps.base.outputs.ref }}" HEAD)" HEAD)"
          has() { grep -qE "$1" <<<"$changed" && echo true || echo false; }
          # Tooling changes re-run every job.
          tooling='^(scripts/style\.sh|\.github/workflows/style\.yml)$'
          echo "backend=$(has "^kolvex-backend-py/|$tooling")" >> "$GITHUB_OUTPUT"
          echo "web=$(has "^kolvex-frontend-web-nextjs/|$tooling")" >> "$GITHUB_OUTPUT"
          echo "mobile=$(has "^kolvex-mobile/|$tooling")" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (ruff)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      STYLE_SCOPE: changed
      RUFF_OUTPUT_FORMAT: github
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kolvex-backend-py/requirements-dev.txt
      - run: pip install -r kolvex-backend-py/requirements-dev.txt
      - name: ruff check + ruff format --check
        run: |
          scope="--base ${{ needs.changes.outputs.base }}"
          [[ "$STYLE_SCOPE" == "all" || "${{ github.event_name }}" == "workflow_dispatch" ]] && scope="--all"
          scripts/style.sh check backend $scope

  web:
    name: Web (prettier)
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      STYLE_SCOPE: changed
    defaults:
      run:
        working-directory: kolvex-frontend-web-nextjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kolvex-frontend-web-nextjs/package-lock.json
      - run: npm ci
      - name: prettier --check
        working-directory: .
        run: |
          scope="--base ${{ needs.changes.outputs.base }}"
          [[ "$STYLE_SCOPE" == "all" || "${{ github.event_name }}" == "workflow_dispatch" ]] && scope="--all"
          scripts/style.sh check web $scope

  mobile:
    name: Mobile (eslint + prettier)
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      STYLE_SCOPE: all
    defaults:
      run:
        working-directory: kolvex-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: kolvex-mobile/.nvmrc
          cache: npm
          cache-dependency-path: kolvex-mobile/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: prettier --check
        working-directory: .
        run: |
          scope="--base ${{ needs.changes.outputs.base }}"
          [[ "$STYLE_SCOPE" == "all" || "${{ github.event_name }}" == "workflow_dispatch" ]] && scope="--all"
          scripts/style.sh check mobile $scope

  style-success:
    name: Code Style
    needs: [changes, backend, web, mobile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          results="changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} web=${{ needs.web.result }} mobile=${{ needs.mobile.result }}"
          echo "$results"
          # skipped = no changes in that project; only failure/cancelled block the merge.
          if grep -qE '=(failure|cancelled)' <<<"$results"; then exit 1; fi
